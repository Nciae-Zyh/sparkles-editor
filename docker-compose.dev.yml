services:
  sparkles-editor-dev:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - /Users/zhaoyouhang/WorkSpace/SparklesEditor/sparkles-editor:/app
      - sparkles-editor-nm:/app/node_modules
      - /Users/zhaoyouhang/Library/pnpm/store/v10:/root/.local/share/pnpm/store/v3
    ports:
      - "3001:3001"
    command: >
      sh -c "npm install -g pnpm &&
             pnpm install &&
             pnpm dev --host 0.0.0.0"
    environment:
      - NODE_ENV=development
    restart: unless-stopped

volumes:
  sparkles-editor-nm:
